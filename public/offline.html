<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Sunday Cricket — offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ea;color:#18211d;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
  .card{max-width:360px;text-align:center;background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 4px 16px rgba(16,40,30,.08)}
  img{width:88px;height:88px;border-radius:22px}
  h1{font-size:22px;margin:14px 0 6px;color:#0a2a20}
  p{margin:0 0 18px;color:rgba(24,33,29,.7);line-height:1.5}
  button{background:#0f3d2e;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:16px}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>No signal at the ground?</h1>
    <p>You're offline right now. Pages you've opened before still work, and scores you enter as umpire are kept on your phone and sent once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
